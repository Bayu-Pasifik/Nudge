name: Build and publish release

# Push a tag like v1.0.0 to build the Android APK and the Windows zip on GitHub's
# runners and attach both to a GitHub Release.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk "Nudge-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Nudge-*-android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Nudge-$env:GITHUB_REF_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Nudge-*-windows-x64.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Pemasangan
            - **Android**: unduh `.apk`, izinkan pemasangan dari sumber ini, lalu buka. Beri izin notifikasi
              dan, di Pengaturan app, ikuti panduan "Agar pengingat selalu bunyi".
            - **Windows**: ekstrak `.zip`, jalankan `nudge.exe`. Nudge tetap berjalan di tray agar pengingat berbunyi.

            APK ditandatangani dengan kunci debug (bukan kunci rilis Play Store). Untuk sinkron antar perangkat,
            hubungkan project Supabase sesuai README.
