name: Build and publish release

# Two ways to run this:
#
#  1. Public release: push a tag like v1.0.0. Builds the Android APK and the
#     Windows zip in LOCAL mode (no Supabase credentials inside) and attaches
#     them to a GitHub Release.
#
#       git tag v1.0.0 && git push origin v1.0.0
#
#  2. Connected build: Actions > "Build and publish release" > Run workflow with
#     "with_supabase" ticked. Builds with your Supabase URL and publishable key
#     from the repository secrets and uploads them as a PRIVATE workflow
#     artifact (visible only to people with access to this repo). It is never
#     attached to a public Release, because anyone holding that app could sign
#     up on your Supabase project.
#
# Secrets needed for (2): SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      with_supabase:
        description: 'Embed the Supabase URL and key (private artifact, no public release)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Empty for public builds. Filled only for a manual "with_supabase" run.
  DEFINES: ${{ (github.event_name == 'workflow_dispatch' && inputs.with_supabase) && format('--dart-define=SUPABASE_URL={0} --dart-define=SUPABASE_PUBLISHABLE_KEY={1}', secrets.SUPABASE_URL, secrets.SUPABASE_PUBLISHABLE_KEY) || '' }}
  SUFFIX: ${{ (github.event_name == 'workflow_dispatch' && inputs.with_supabase) && '-connected' || '' }}
  VERSION: ${{ github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release $(case "$GITHUB_REF" in refs/tags/v*) echo "--build-name=${VERSION#v}";; esac) $DEFINES
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk "Nudge-${VERSION}${SUFFIX}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android${{ env.SUFFIX }}
          path: Nudge-*-android.apk
          retention-days: ${{ env.SUFFIX == '' && 1 || 14 }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: flutter build windows --release $(case "$GITHUB_REF" in refs/tags/v*) echo "--build-name=${VERSION#v}";; esac) $DEFINES
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Nudge-$env:VERSION$env:SUFFIX-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows${{ env.SUFFIX }}
          path: Nudge-*-windows-x64.zip
          retention-days: ${{ env.SUFFIX == '' && 1 || 14 }}

  release:
    # Public releases only: never for a connected (credential-bearing) build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Pemasangan
            - **Android**: unduh `.apk`, izinkan pemasangan dari sumber ini, lalu buka. Beri izin notifikasi
              dan, di Pengaturan app, ikuti panduan "Agar pengingat selalu bunyi".
            - **Windows**: ekstrak `.zip`, jalankan `nudge.exe`. Nudge tetap berjalan di tray agar pengingat berbunyi.

            Build ini berjalan dalam **mode lokal** (data hanya di perangkat). Untuk sinkron antar perangkat,
            bangun sendiri dengan project Supabase kamu (lihat README).
            APK ditandatangani dengan kunci debug (bukan kunci rilis Play Store).
